[project]
name = "corporate-data-narrative-lab"
version = "0.1.0"
description = "Narrativas corporativas centradas en datos con evidencia visual simple."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0"
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
]
dev = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
